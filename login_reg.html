<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login — VoltHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth">

    <aside class="auth__brand">
      <a href="index.html" class="brand"><span class="brand__mark">⚡</span>VoltHub</a>
      <div>
        <h1>Buy your wants and needs of gadgets at our store!</h1>
        <p>The most trusted store for gadgets!</p>
        <ul class="auth__points">
          <li>🛒 <span>Add to cart</span></li>
          <li>📦 <span>We process</span></li>
          <li>🚚 <span>And ship it to you!</span></li>
        </ul>
      </div>
      <small>© 2026 VoltHub</small>
    </aside>

    <main class="auth__panel">
      <div class="auth__card">
        <a href="index.html" class="brand auth__mobile-brand"><span class="brand__mark">⚡</span>VoltHub</a>

        <div>
          <h2 id="title">Welcome!</h2>
          <p id="subtitle" class="muted">Sign in to VoltHub.</p>
        </div>

        <div class="tabs" role="tablist">
          <button class="tab active" data-tab="login" role="tab">Log in</button>
          <button class="tab" data-tab="register" role="tab">Register</button>
        </div>

        <!-- Login -->
        <form id="loginForm" novalidate>
          <div id="loginError" class="form-error" hidden></div>
          <div class="field">
            <label for="lUser">Username</label>
            <input id="lUser" class="input" type="text" autocomplete="username" placeholder="Username" required>
          </div>
          <div class="field">
            <label for="lPass">Password</label>
            <div class="input-wrap">
              <input id="lPass" class="input" type="password" autocomplete="current-password" placeholder="********" required>
              <button type="button" class="toggle-pass" aria-label="Show password">👁️</button>
            </div>
          </div>
          <button class="btn btn--primary btn--block" type="submit">Log in</button>
          <div class="hint">Demo account: <strong>admin</strong> / <strong>admin123</strong></div>
        </form>

        <!-- Register -->
        <form id="regForm" novalidate hidden>
          <div id="regError" class="form-error" hidden></div>
          <div class="field">
            <label for="rName">Full name</label>
            <input id="rName" class="input" type="text" autocomplete="name" placeholder="Juan Dela Cruz" required>
          </div>
          <div class="field">
            <label for="rUser">Username</label>
            <input id="rUser" class="input" type="text" autocomplete="username" placeholder="juan" required>
          </div>
          <div class="field">
            <label for="rPass">Password</label>
            <div class="input-wrap">
              <input id="rPass" class="input" type="password" autocomplete="new-password" placeholder="At least 6 characters" required>
              <button type="button" class="toggle-pass" aria-label="Show password">👁️</button>
            </div>
          </div>
          <div class="field">
            <label for="rPass2">Confirm password</label>
            <input id="rPass2" class="input" type="password" autocomplete="new-password" placeholder="Repeat password" required>
          </div>
          <button class="btn btn--primary btn--block" type="submit">Create admin account</button>
        </form>

        <p class="back-link"><a href="index.html">← Back to store</a></p>
      </div>
    </main>
  </div>

  <script src="js/app.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
